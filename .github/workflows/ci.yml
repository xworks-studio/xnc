# ci.yml — 测试门禁（设计：docs/ci-release-and-deploy.md §2）
# PR 与 main push 全绿方可合并；concurrency 取消过期运行以节省配额。
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
      # agent 模块在 linux 存在预存在构建失败（agent/session，与新增
      # 变更无关，见设计 §2.3）——linux 仅测试跨平台模块，agent 由
      # go-windows 覆盖。mockagent 依赖 agent/session 且仅用于 Windows
      # 负载测试，一并排除。rtvload 依赖 quic-go（跨平台，linux 覆盖）。
      - name: test (proto server cli shellsmoke tools)
        run: |
          for m in proto server cli shellsmoke tools/desktopreport tools/nalcheck tools/rtvload; do
            echo "=== $m ==="
            (cd "$m" && go vet ./... && go test ./... )
          done
      - name: build shellhost root (linux 编译门禁)
        run: (cd shellhost && go build .)
        # cmd/xnc-shell-probe 依赖 winio（Windows-only），不在 linux 编译。
      - name: upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: go-linux-logs
          path: |
            **/*.test.log
          if-no-files-found: ignore

  go-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
      # agent 全量（含 updater/orchestrate 真实进程语义测试）
      - name: test agent
        run: |
          cd agent
          go vet ./...
          go test ./...
      - name: test shellhost (windows integration)
        run: |
          cd shellhost
          go vet ./...
          go test ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: lint + test + build
        run: |
          cd web
          npm ci
          npx oxlint
          npm run test
          npm run build

  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: restore native cache
        id: nativecache
        uses: actions/cache@v4
        with:
          path: |
            bin/xnc-core.exe
          key: native-${{ runner.os }}-${{ hashFiles('native/**') }}
      - name: build core (compile gate, cache miss only)
        if: steps.nativecache.outputs.cache-hit != 'true'
        shell: cmd
        run: cd native\core && call build.bat

  # RTV host（Rust 采集端）：cargo test（RS 黄金向量/组帧契约）+ release
  # 编译门禁。vcpkg 重依赖（ffmpeg[amf,nvcodec,qsv]+libyuv，x64-windows-
  # static）用 GitHub Actions 二进制缓存复用——首跑 ~40min，命中后 ~分钟级。
  host-rust:
    runs-on: windows-latest
    env:
      VCPKG_ROOT: C:\vcpkg
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: restore caches
        id: hostcache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            host/target
          key: host-${{ runner.os }}-${{ hashFiles('host/Cargo.lock') }}-${{ hashFiles('third_party/scrap/**') }}
      - name: restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: vcpkg-bincache
          key: vcpkg-bin-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: vcpkg install (binary-cached)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & C:\vcpkg\vcpkg.exe install --triplet x64-windows-static ffmpeg[amf,nvcodec,qsv] libyuv
      - name: cargo test (RS golden vectors + framing)
        working-directory: host
        run: cargo test
      - name: cargo build --release (compile gate)
        working-directory: host
        run: cargo build --release

  # web RS 黄金向量已并入 web job（vitest src/lib/rtv/rs.test.js）。

  installer-dryrun:
    # 仅 main：验证 .iss/build.ps1 可产出安装器（无签名，无 pfx 依赖）。
    # native 产物使用 native/** 哈希缓存 + -ReuseNative——MSVC 仅在
    # native 变更时重新编译（dryrun 的主要耗时来源）。
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
      - name: restore native + host cache
        uses: actions/cache@v4
        with:
          path: |
            bin/xnc-core.exe
            bin/xnc-host.exe
          key: bins-${{ runner.os }}-${{ hashFiles('native/**', 'host/**', 'third_party/scrap/**') }}
      - name: install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: build installer (unsigned, reuse cached native)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          powershell -NoProfile -ExecutionPolicy Bypass -File installer\build.ps1 -Version 0.0.0-ci -Channel stable -ISCC $iscc -ReuseNative
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-installer
          path: bin/*.exe
          if-no-files-found: error
