# build-server.yml — server 版本镜像构建（手动触发，版本号驱动）：
#   workflow_dispatch 输入 version（X.Y.Z[-dev]，段 ≤4 位）
#   → 构建 web + 镜像（版本注入）→ 推 GHCR，标签 v<version> + latest + sha-<短哈希>
# 服务器侧 Watchtower 跟踪 :latest 自动拉取重建——每次手动构建即为一次发布。
# （不随 push main 自动构建：server 发布节奏由人工控制，与 agent 发版策略一致。）
name: build-server

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'server 版本（X.Y.Z 或 X.Y.Z-dev，段 ≤4 位）'
        required: true

permissions:
  contents: read
  packages: write # GHCR 推送

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: validate version format
        run: |
          v="${{ inputs.version }}"
          echo "$v" | grep -qE '^[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,4}(-dev)?$' || {
            echo "::error::bad version '$v' (want X.Y.Z[-dev], segments 1-4 digits)"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build web (dist 进入 docker 上下文；服务器不执行 npm)
        run: |
          cd web
          npm ci
          npm run build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            XNC_VERSION=${{ inputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/xnc-server:v${{ inputs.version }}
            ghcr.io/${{ github.repository_owner }}/xnc-server:latest
            ghcr.io/${{ github.repository_owner }}/xnc-server:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
