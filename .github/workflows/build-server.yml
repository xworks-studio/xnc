# build-server.yml — server 镜像构建推送 GHCR（设计文档 §4）：
#   push main → 镜像标签 main + sha-<短哈希>（版本 main-<短哈希>）
#   tag  v*   → 镜像标签 vX.Y.Z + latest（版本 = tag 版本）
# 服务器侧由 Watchtower（compose 内独立容器）轮询 GHCR 自动拉取重建，
# 与 server 产品本身零耦合。GHCR 私有包的服务器拉取授权见设计 §4.3。
name: build-server

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write # GHCR 推送

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: derive version + image tags
        run: |
          ref="${{ github.ref_name }}"
          if [[ "$ref" == v* ]]; then
            ver="${ref#v}"
            tags="latest v${ver}"
          else
            sha="${GITHUB_SHA::7}"
            ver="main-${sha}"
            tags="main sha-${sha}"
          fi
          {
            echo "version=${ver}"
            echo "tags<<EOF"
            for t in $tags; do echo "ghcr.io/${{ github.repository_owner }}/xnc-server:${t}"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build web (dist 进 docker 上下文；服务器从不跑 npm)
        run: |
          cd web
          npm ci
          npm run build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            XNC_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
