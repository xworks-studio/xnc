# build-server.yml — server 镜像构建与发布（设计文档 §4）：CI 只产出并
# 发布文件，不触碰服务器；SRV 侧 deploy/pull-server.sh 定时拉取部署。
#   push main → 版本 main-<短哈希>；tag v* → 版本 <tag 版本>
# 发布通道：release store 的 channel=server release，制品 server-image.tar.gz；
# 下载端点 GET /server-image（响应头 X-Xnc-Version 供拉取脚本比对）。
name: build-server

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: derive version
        run: |
          ref="${{ github.ref_name }}"
          if [[ "$ref" == v* ]]; then ver="${ref#v}"; else ver="main-${GITHUB_SHA::7}"; fi
          echo "version=${ver}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: build web (dist 进 docker 上下文)
        run: |
          cd web
          npm ci
          npm run build

      - name: build image + save tar
        run: |
          ver="${{ steps.meta.outputs.version }}"
          docker build -f deploy/Dockerfile --build-arg XNC_VERSION="${ver}" \
            -t "xnc-server:${ver}" .
          mkdir -p /tmp/ship
          docker save "xnc-server:${ver}" | gzip > "/tmp/ship/server-image.tar.gz"
          ls -lh /tmp/ship

      - name: publish to release store (channel=server) + verify
        env:
          SERVER: ${{ secrets.XNC_SERVER_URL }}
          EMAIL: ${{ secrets.XNC_ADMIN_EMAIL }}
          PASSWD: ${{ secrets.XNC_ADMIN_PASSWORD }}
        run: |
          ver="${{ steps.meta.outputs.version }}"
          jwt=$(curl -sf -X POST "$SERVER/api/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PASSWD\"}" | jq -r .token)
          curl -sf -X POST "$SERVER/api/admin/releases" \
            -H "Authorization: Bearer $jwt" \
            -F "version=$ver" \
            -F "notes=server image (CI build ${{ github.sha }})" \
            -F "channel=server" \
            -F "server=@/tmp/ship/server-image.tar.gz;type=application/gzip" > /dev/null
          # 回读校验：版本头必须匹配（防上传假成功）
          got=$(curl -sI "$SERVER/server-image?channel=server" | tr -d '\r' | awk -F': ' '/^X-Xnc-Version/{print $2}')
          [ "$got" = "$ver" ] || { echo "::error::readback version=$got want=$ver"; exit 1; }
          echo "published: $ver"
