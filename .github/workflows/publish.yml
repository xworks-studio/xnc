# release.yml — 手动触发发布（设计：docs/ci-release-and-deploy.md §3）
# 输入版本号（X.Y.Z[-dev]，段 ≤4 位）→ 在当前 main HEAD 创建并推 tag
# v<version>（构建成功后才打 tag：构建失败不留孤儿 tag；tag 已存在即拒绝
# = 版本不可变）→ 签名构建 → GitHub Release（发布终点；生产 server 由
# installersync 定时拉取，CI 不直接上传生产）。
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（X.Y.Z 或 X.Y.Z-dev，段 ≤4 位）'
        required: true

permissions:
  contents: write # tag 推送 + GitHub Release 附件

env:
  # RTV host（Rust 采集端）构建环境（build.ps1 的 cargo 步骤消费）。
  VCPKG_ROOT: C:\vcpkg
  LIBCLANG_PATH: C:\Program Files\LLVM\bin
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # main HEAD 校验与 tag 创建需要

      - name: validate version (format + main HEAD + tag not taken)
        shell: pwsh
        run: |
          $ver = "${{ inputs.version }}"
          if ($ver -notmatch '^\d{1,4}\.\d{1,4}\.\d{1,4}(-dev)?$') {
            throw "bad version '$ver' (want X.Y.Z[-dev], segments 1-4 digits)"
          }
          # 发布对象 = 触发时的 main HEAD（须选 main 分支触发）。
          git fetch origin main
          if ((git rev-parse HEAD) -ne (git rev-parse origin/main)) {
            throw "workflow must run at main HEAD - re-run with the main branch selected"
          }
          # 版本不可变：tag 已存在即拒绝（修复 = 新 PATCH 版本）。
          git ls-remote --exit-code origin "refs/tags/v$ver" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            throw "tag v$ver already exists - versions are immutable; bump the patch version"
          }
          $ch = if ($ver.EndsWith('-dev')) { 'dev' } else { 'stable' }
          "VERSION=$ver" | Out-File $env:GITHUB_ENV -Append utf8
          "CHANNEL=$ch" | Out-File $env:GITHUB_ENV -Append utf8
          # Release 正文 = main HEAD 提交信息（手动触发无 head_commit 事件）。
          $msg = (git log -1 --pretty=%B | Out-String).TrimEnd()
          "RELEASE_BODY<<XNCEOF" | Out-File $env:GITHUB_ENV -Append utf8
          $msg | Out-File $env:GITHUB_ENV -Append utf8
          "XNCEOF" | Out-File $env:GITHUB_ENV -Append utf8

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work

      - uses: dtolnay/rust-toolchain@stable

      - name: restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: vcpkg-bincache
          key: vcpkg-bin-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: vcpkg install (host deps - ffmpeg hw encoders + libyuv)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & C:\vcpkg\vcpkg.exe install --triplet x64-windows-static ffmpeg[amf,nvcodec,qsv] libyuv

      - name: install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: restore signing cert
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.XNC_CODESIGN_PFX }}
          PFX_PASS: ${{ secrets.XNC_CODESIGN_PASSWORD }}
        run: |
          if (-not $env:PFX_B64 -or -not $env:PFX_PASS) {
            throw "secrets XNC_CODESIGN_PFX / XNC_CODESIGN_PASSWORD not configured"
          }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\codesign.pfx",
            [Convert]::FromBase64String($env:PFX_B64))
          "XNC_CODESIGN_PASSWORD=$env:PFX_PASS" | Out-File $env:GITHUB_ENV -Append utf8

      - name: build + sign installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          powershell -NoProfile -ExecutionPolicy Bypass -File src\installer\build.ps1 `
            -Version $env:VERSION -Channel $env:CHANNEL -ISCC $iscc
          $name = "XNC-Installer$(if ($env:CHANNEL -eq 'dev') {'-dev'})-$env:VERSION.exe"
          "ARTIFACT=bin\$name" | Out-File $env:GITHUB_ENV -Append utf8

      - name: create immutable tag at main HEAD
        # 构建成功后才打 tag：构建/签名失败不产生孤儿 tag，可直接重触发。
        shell: pwsh
        run: |
          git config user.name "xnc-release-bot"
          git config user.email "release@xnc.app"
          $tag = "v$env:VERSION"
          git tag -a $tag -m "release $tag"
          git push origin "refs/tags/$tag"

      - name: GitHub Release
        # 手动触发的 ref 是 main（非 tag），须显式 tag_name 指向刚推的 tag。
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          files: |
            ${{ env.ARTIFACT }}
            ${{ env.ARTIFACT }}.sha256
          body: ${{ env.RELEASE_BODY }}
          # dev 频道标记 prerelease：GitHub "Latest" 仅指向 stable（与
          # 下载页展示一致）。server 侧同步按 tag 分类，不依赖该标记。
          prerelease: ${{ env.CHANNEL == 'dev' }}

      - name: summary
        shell: pwsh
        run: |
          $sha = (Get-FileHash $env:ARTIFACT -Algorithm SHA256).Hash.ToLower()
          Write-Host "released $env:VERSION ($env:CHANNEL) sha256=$sha"
          Write-Host "发布终点为 GitHub Release；生产 server 由 installersync 在一个同步间隔内自动拉取"
          Write-Host "验证：curl https://xnc.app/installer.json?channel=$env:CHANNEL （约 5 分钟内生效）"

