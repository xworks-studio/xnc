# XNC coturn configuration — single source for the production TURN/STUN
# server (docs/2026-08-24-prod-deploy-retro.md Task 6; was inline compose
# flags). Mounted read-only into the coturn container at
# /etc/coturn/turnserver.conf and started with `turnserver -c` (see
# docker-compose.yml).
#
# TEMPLATE: coturn config files have no native environment expansion, so
# deploy/deploy_srv.py `up` renders ${VAR} / ${VAR:-default} from
# deploy/.env (the same values compose interpolates) before `docker
# compose up`. Local dev keeps its own coturn flags in
# docker-compose.turn-dev.yml (dev-only divergence, documented there).

realm=${XNC_TURN_REALM:-xnc.app}
fingerprint
lt-cred-mech
# coturn user 密码须与 XNC_TURN_CREDENTIAL 同值(server 只读后者);
# deploy_srv.py 渲染时 XNC_TURN_PASSWORD 缺省取 CREDENTIAL 值(自动同步)。
user=${XNC_TURN_USERNAME:-xncdev}:${XNC_TURN_PASSWORD:-xncdev-secret}
listening-port=3478
listening-ip=0.0.0.0
# relay-ip 故意不配置：写死容器 IP 会在 compose 网络重建后漂移失效
#（2026-09-06 生产事故：172.18.0.3 ≠ 实际 172.18.0.2，所有 TURN 分配
# 508）。coturn 自动选用本机地址；公网映射只靠 external-ip。
# external-ip 同样不配置：coturn 以 host 网络直挂（无 docker NAT），
# NAT+external-ip 映射形态会拒绝"对端=自身公网地址"的中继（同日实测：
# 回环探测 checking→disconnected、channel-bind 403），对齐池机裸金属形态。
min-port=49160
max-port=49200
no-cli
no-tls
no-dtls
