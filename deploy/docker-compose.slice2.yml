# M1-Slice2 dev topology overlay (docs: scripts/dev-topology.md).
#
# Adds, on top of the base + dev overlays:
#   - coturn (static lt-cred dev user, non-TLS dev TURN; TLS/443 is M2)
#   - a LAN-reachable server port (0.0.0.0:18080 -> 8080) so the
#     console-run dev agent on XIAOXIN can reach this dev server.
#     The dev overlay's 127.0.0.1:8080 binding stays untouched for
#     local tooling. 18080 is plain HTTP/WS: dev-only, LAN-only posture.
#
# Up:
#   cd deploy && docker compose -f docker-compose.yml -f docker-compose.dev.yml \
#       -f docker-compose.slice2.yml up -d --build
#
# Required env (deploy/.env is read automatically):
#   XNC_DEV_EXTERNAL_IP   this host's LAN IP (advertised by coturn as
#                         external-ip; relay ports are mapped 1:1)
services:
  xnc-server:
    ports:
      - "18080:8080"
    environment:
      # Dev-overlay default (10s) targets E2E offline windows; the slice2 dev
      # loop keeps a long-lived agent whose heartbeat is 30s — anything below
      # ~35s makes node status flap offline between beats.
      XNC_HEARTBEAT_TIMEOUT: ${XNC_HEARTBEAT_TIMEOUT:-45s}
      # TURN relay config handed to desktop sessions (server-side only; the
      # REST endpoint and SESSION_OPEN params both source it from here).
      # Mirrors the coturn static lt-cred user below; URLs must point at the
      # LAN IP (XNC_DEV_EXTERNAL_IP), not localhost — agents/viewers dial in
      # from other hosts. Missing/partial config = desktop POST 503
      # TURN_UNCONFIGURED. TCP URL first (dev posture), plain turn: UDP fallback.
      XNC_TURN_URLS: "turn:${XNC_DEV_EXTERNAL_IP:?set XNC_DEV_EXTERNAL_IP in deploy/.env}:3478?transport=tcp,turn:${XNC_DEV_EXTERNAL_IP}:3478"
      XNC_TURN_USERNAME: xncdev
      XNC_TURN_CREDENTIAL: xncdev-secret
      # Desktop per-node concurrent viewer cap. Stated explicitly (matches the
      # built-in default and the agent host pipe's max_subs=4) so the multi-
      # viewer posture of this overlay is visible here; 0 = unlimited.
      XNC_DESKTOP_PER_NODE: "4"

  coturn:
    image: coturn/coturn:alpine
    # Dev-only divergence from the base compose (production coturn runs the
    # rendered deploy/turnserver.conf via `-c`; dev keeps inline flags because
    # the checked-in template is prod-oriented and this overlay predates the
    # config file — see docker-compose.yml coturn comment).
    # -n: no pid file. --no-tls/--no-dtls: dev TURN is plain turn: ...?transport=tcp.
    # Static lt-cred user (slice2 dev); M2 moves to REST-cred turnover.
    command:
      - -n
      - --realm=xnc.dev
      - --fingerprint
      - --lt-cred-mech
      - --user=xncdev:xncdev-secret  # dev 静态凭据;密码须与 server 的 XNC_TURN_CREDENTIAL 同值(默认 xncdev-secret)
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-tls
      - --no-dtls
      - --external-ip=${XNC_DEV_EXTERNAL_IP:?set XNC_DEV_EXTERNAL_IP to this host's LAN IP in deploy/.env}
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
