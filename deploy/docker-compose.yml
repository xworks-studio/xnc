services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: xnc
      POSTGRES_USER: xnc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xnc"]
      interval: 5s
      timeout: 3s
      retries: 12

  xnc-server:
    # 镜像化交付：build-server.yml 手动触发（输入版本号）推 GHCR
    # v<版本> + latest + sha 标签；Watchtower 跟踪 :latest 自动拉取重建。
    # 锁版本/回滚 = 改 tag 为 :v<版本> 后 up -d。
    image: ghcr.io/xworks-studio/xnc-server:latest
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    environment:
      XNC_DATABASE_URL: postgres://xnc:${POSTGRES_PASSWORD}@postgres:5432/xnc
      XNC_JWT_SECRET: ${XNC_JWT_SECRET}
      XNC_ADMIN_EMAIL: ${XNC_ADMIN_EMAIL}
      XNC_ADMIN_PASSWORD: ${XNC_ADMIN_PASSWORD}
      # installer 分发同步（installersync）：GitHub Releases 唯一事实源，
      # server 定时拉取至本地 release store（/installer 服务路径不变；CI
      # 发布止于 GitHub Release）。REPO 空 = 关闭；INTERVAL 下限 1m；
      # TOKEN 可选（匿名 60 req/h 可满足轮询需求，需提升限额时配置）。
      XNC_INSTALLER_SYNC_REPO: ${XNC_INSTALLER_SYNC_REPO:-xworks-studio/xnc}
      XNC_INSTALLER_SYNC_INTERVAL: ${XNC_INSTALLER_SYNC_INTERVAL:-5m}
      XNC_GITHUB_TOKEN: ${XNC_GITHUB_TOKEN:-}
      # —— RTV 桌面中继（2026-09-08 重构，替代 TURN/WebRTC 面）——
      # 2026-09-11 主站缩减（relay-only 默认）：XNC_RTV_EMBEDDED=false 时主站
      # 不跑媒体面——不创建内嵌 rtv.Server/不挂 /ws/不启 ACME，桌面只经
      # 外置 xnc-relay（rtvpool 分配；无可用 → 503 RTV_NO_RELAY）。以下
      # XNC_RTV_ENDPOINT/HOST_ADDR/WT_ADDR/CERT/WT_PORT 仅内嵌模式生效；
      # 过渡期（relay 就位前）可临时置 true 保内嵌运行。
      XNC_RTV_EMBEDDED: ${XNC_RTV_EMBEDDED:-false}
      # host 腿 QUIC 地址（agent 经 SESSION_OPEN 收到；生产 = 域名:4433）。
      XNC_RTV_ENDPOINT: ${XNC_RTV_ENDPOINT:-xnc.app:4433}
      # 容器内监听（host 腿 UDP4433 / WT 腿 UDP443；均需 compose 端口映射）。
      XNC_RTV_HOST_ADDR: ":4433"
      XNC_RTV_WT_ADDR: ":443"
      # RTV 腿证书：复用 caddy 的 LE 证书（cert-sync sidecar 每小时同步到
      # ./rtv-certs，热加载按 mtime）——真实 CA，浏览器 WT 走标准 Web PKI。
      # 换用 server 内嵌 ACME DNS-01（XNC_ACME_DOMAIN + ALIDNS_*，凭据入
      # deploy/.env）时移除这两项与 cert-sync 服务即可。
      XNC_RTV_CERT_FILE: /certs/xnc.app.crt
      # —— relay-plane P1：RelayTicket 签名密钥（ed25519 64B hex；空 = 进程
      # 内临时生成，重启作废——部署外部 relay 时必须显式配置）与 relay
      # 公钥准入清单（逗号分隔 hex；命中注册即 active，未命中落 pending）。——
      XNC_RTV_SIGNING_KEY: ${XNC_RTV_SIGNING_KEY:-}
      XNC_RTV_RELAY_ALLOWLIST: ${XNC_RTV_RELAY_ALLOWLIST:-}
      XNC_RTV_KEY_FILE: /certs/xnc.app.key
      XNC_RTV_WT_PORT: ${XNC_RTV_WT_PORT:-}
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["8080"]
    ports:
      # RTV 腿：host QUIC（agent→server）与 WT（浏览器 H3）。容器 NAT 对纯
      # 客户端→服务端 QUIC 足够（无连接迁移/反射地址协商，coturn 式 host
      # 网络不必要）。
      - "443:443/udp"
      - "4433:4433/udp"
      # 过渡期 WT 非规范端口（UDP443 被安全组拦截时浏览器走这里；放行
      # 443/udp 后置空 XNC_RTV_WT_PORT 即回规范 URL）。
      - "14433:443/udp"
    volumes:
      - rtv-certs:/data/rtv-certs
      # caddy 签发的 LE 证书（cert-sync 每小时同步；热加载按 mtime）。
      - ./rtv-certs:/certs:ro

  # cert-sync：caddy_data → ./rtv-certs 证书同步（每小时）。caddy 的 ACME
  # 自动续期保持 TCP443 有效，本 sidecar 让 RTV 腿共用同一真实 CA 证书
  # （免新增 DNS-01 凭据；文件 0644 供 distroless nonroot 读取）。换用
  # server 内嵌 ACME（XNC_ACME_DOMAIN + ALIDNS_*）时本服务可整体移除。
  cert-sync:
    image: alpine:3.20
    restart: unless-stopped
    volumes:
      - caddy_data:/caddy:ro
      - ./rtv-certs:/out
    entrypoint: ["/bin/sh", "-c", "while true; do cp /caddy/caddy/certificates/*/xnc.app/xnc.app.crt /out/xnc.app.crt 2>/dev/null; cp /caddy/caddy/certificates/*/xnc.app/xnc.app.key /out/xnc.app.key 2>/dev/null; chmod 0644 /out/xnc.app.crt /out/xnc.app.key 2>/dev/null; sleep 3600; done"]
    labels:
      com.centurylinklabs.watchtower.enable: "false"

  # Watchtower：轮询 GHCR 自动更新 xnc-server（label 圈定范围，仅此一个
  # 服务被管理；5 分钟一轮；--cleanup 清旧镜像；不做滚动重启——单实例）。
  # GHCR 私有包授权：宿主 root 已 docker login ghcr.io（Watchtower 挂载
  # 同一 config.json）。
  watchtower:
    # containrrr 原版 2023 归档、旧 Docker API 与新引擎不兼容（client
    # version 1.25 < 1.40）；nicholas-fedor 是维护中的接续 fork。
    image: ghcr.io/nicholas-fedor/watchtower:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json:ro
    command: --label-enable --interval 300 --cleanup --revive-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      XNC_DOMAIN: ${XNC_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [xnc-server]

  # coturn 已随 RTV 重构退役（2026-09-08）：desktop 是 TURN 的唯一用户，
  # 媒体面改经 xnc-server 的 QUIC/WT/WS 三腿中继。回滚旧版 = git checkout
  # 上一版 compose（turnserver.conf 模板仍保留在仓库供回滚窗口使用）。

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  rtv-certs:
