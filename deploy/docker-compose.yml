services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: xnc
      POSTGRES_USER: xnc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xnc"]
      interval: 5s
      timeout: 3s
      retries: 12

  xnc-server:
    # 镜像化交付（无镜像仓库）：build-server.yml 在 CI 构建版本镜像 →
    # docker save 成 tar → SCP 直送本机 /opt/xnc/images/ → docker load
    # 并打 xnc-server:local 本地 tag。pull_policy: never——绝不向远端
    # registry 拉取；回滚 = docker tag xnc-server:<旧版本> xnc-server:local
    # 后 up -d（images/ 保留最近 5 份版本 tar）。
    image: xnc-server:local
    pull_policy: never
    environment:
      XNC_DATABASE_URL: postgres://xnc:${POSTGRES_PASSWORD}@postgres:5432/xnc
      XNC_JWT_SECRET: ${XNC_JWT_SECRET}
      XNC_ADMIN_EMAIL: ${XNC_ADMIN_EMAIL}
      XNC_ADMIN_PASSWORD: ${XNC_ADMIN_PASSWORD}
      # M4 金丝雀开关(§14): compose 此前未接线,M4-T4 部署缺口,生产 2026-08-28 补
      XNC_DESKTOP_MEDIA_V2_PERCENT: ${XNC_DESKTOP_MEDIA_V2_PERCENT:-0}
      XNC_DESKTOP_MEDIA_V2_ALLOWLIST: ${XNC_DESKTOP_MEDIA_V2_ALLOWLIST:-}
      XNC_DESKTOP_MEDIA_V2_ROLLBACK: ${XNC_DESKTOP_MEDIA_V2_ROLLBACK:-false}
      # Desktop ICE policy (M4 Task 7): "relay" (default, spec-mandated) keeps
      # all media through TURN; "all" allows LAN direct connect when browser
      # and node share a LAN (bypasses the public TURN relay round-trip).
      XNC_DESKTOP_ICE_POLICY: ${XNC_DESKTOP_ICE_POLICY:-relay}
      # TURN relay config handed to desktop sessions (mirrors coturn below).
      # server 只读 XNC_TURN_CREDENTIAL(单一来源,config.go);XNC_TURN_PASSWORD
      # 仅供 coturn 自身用户配置(turnserver.conf 模板,见下),与 server env 无关。
      XNC_TURN_URLS: ${XNC_TURN_URLS:-turn:xnc.app:3478?transport=tcp}
      XNC_TURN_USERNAME: ${XNC_TURN_USERNAME:-xncdev}
      XNC_TURN_CREDENTIAL: ${XNC_TURN_CREDENTIAL:-xncdev-secret}
      # TURN 池（境内媒体中转）：逗号分隔 ip[:port]（缺省端口 3478），空 =
      # 未配置 → 沿用 XNC_TURN_URLS（现状）。池配置后 desktop 会话从池中
      # round-robin 分配单台，凭据与上面 XNC_TURN_USERNAME/CREDENTIAL 共用
      # （CREDENTIAL 即唯一凭据来源）。
      XNC_TURN_POOL: ${XNC_TURN_POOL:-}
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["8080"]

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      XNC_DOMAIN: ${XNC_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [xnc-server]

  coturn:
    image: coturn/coturn:alpine
    # TURN/STUN config lives in ./turnserver.conf (mounted read-only), not
    # as CLI flags: the image entrypoint evals each arg through `echo`, so a
    # bare `-n` or `$`-containing flag gets mangled (2026-08-24 retro P0#5);
    # `-c` + a plain path is the only safe form. The checked-in file is a
    # template: deploy_srv.py `up` renders ${VAR}/…:-default from deploy/.env
    # first (coturn config files have no native env expansion). Prod TURN:
    # static lt-cred user, plain turn: TCP/UDP — no TLS this round.
    # coturn user 密码须与 XNC_TURN_CREDENTIAL 同值:deploy_srv.py 渲染
    # turnserver.conf 时 XNC_TURN_PASSWORD 缺省取 CREDENTIAL 值(自动同步,
    # 只改 CREDENTIAL 不错配)。
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
