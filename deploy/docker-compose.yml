services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: xnc
      POSTGRES_USER: xnc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xnc"]
      interval: 5s
      timeout: 3s
      retries: 12

  xnc-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      XNC_DATABASE_URL: postgres://xnc:${POSTGRES_PASSWORD}@postgres:5432/xnc
      XNC_PUBLIC_URL: ${XNC_PUBLIC_URL:-https://control.xnc.app}
      XNC_JWT_SECRET: ${XNC_JWT_SECRET}
      XNC_ADMIN_EMAIL: ${XNC_ADMIN_EMAIL}
      XNC_ADMIN_PASSWORD: ${XNC_ADMIN_PASSWORD}
      # TURN relay config handed to desktop sessions (mirrors coturn below).
      XNC_TURN_URLS: ${XNC_TURN_URLS:-turn:control.xnc.app:3478?transport=tcp}
      XNC_TURN_USERNAME: ${XNC_TURN_USERNAME:-xncdev}
      XNC_TURN_PASSWORD: ${XNC_TURN_PASSWORD:-xncdev-secret}
      XNC_TURN_CREDENTIAL: ${XNC_TURN_CREDENTIAL:-xncdev-secret}
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["8080"]

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      XNC_DOMAIN: ${XNC_DOMAIN}
      XNC_SHORT_DOMAIN: ${XNC_SHORT_DOMAIN:-xnc.app}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [xnc-server]

  coturn:
    image: coturn/coturn:alpine
    # Prod TURN: static lt-cred user (from env, dev defaults for now), plain
    # turn: TCP/UDP — no TLS this round (REST-cred + TLS later).
    command:
      - -n
      - --realm=xnc.app
      - --fingerprint
      - --lt-cred-mech
      - --user=${XNC_TURN_USERNAME:-xncdev}:${XNC_TURN_PASSWORD:-xncdev-secret}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --no-cli
      - --no-tls
      - --no-dtls
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
